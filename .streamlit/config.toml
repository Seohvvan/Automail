[theme]
base = "light"

# 절제된 딥블루 포인트 (primary 버튼·활성 탭·포커스 링에만 사용)
primaryColor = "#3453B2"
linkColor = "#3453B2"

# 순백 대신 옅은 블루그레이 배경 + 흰색 카드/위젯으로 위계 형성
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"

textColor = "#1C2431"

# 위젯 테두리·라운딩 (Streamlit >= 1.47 확장 테마 옵션)
borderColor = "#E3E8F0"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
